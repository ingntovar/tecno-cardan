      <stop offset="0" stop-color="#F7E7A6"/>
      <stop offset="0.28" stop-color="#D9B34A"/>
      <stop offset="0.62" stop-color="#9A6E13"/>
      <stop offset="1" stop-color="#F0D47A"/>
