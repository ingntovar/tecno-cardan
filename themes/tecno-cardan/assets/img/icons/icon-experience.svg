      <path fill="url(#gold)" d="M-17-112h34l8 33c12 3 23 8 33 14l29-18 24 24-18 29c6 10 11 21 14 33l33 8v34l-33 8c-3 12-8 23-14 33l18 29-24 24-29-18c-10 6-21 11-33 14l-8 33h-34l-8-33c-12-3-23-8-33-14l-29 18-24-24 18-29c-6-10-11-21-14-33l-33-8v-34l33-8c3-12 8-23 14-33l-18-29 24-24 29 18c10-6 21-11 33-14z"/>
      <circle r="68" fill="url(#navy)" stroke="#F0D47A" stroke-width="11"/>
