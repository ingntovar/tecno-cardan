      <!-- MOBILE ACTIONS -->

        <!-- WHATSAPP MOBILE -->

          class="site-header__whatsapp-mobile"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Contactar por WhatsApp"
        >
          <svg
            viewBox="0 0 32 32"
            width="22"
            height="22"

            <path

              d="M16.04 3C8.84 3 3 8.7 3 15.74c0 2.25.61 4.45 1.76 6.37L3 29l7.07-1.82a13.32 13.32 0 0 0 5.96 1.43h.01C23.24 28.61 29 22.91 29 15.87 29 8.82 23.24 3 16.04 3Zm7.57 18.23c-.32.88-1.88 1.69-2.58 1.78-.66.09-1.5.13-2.42-.15-.56-.17-1.28-.41-2.21-.81-3.89-1.65-6.43-5.49-6.62-5.75-.19-.25-1.58-2.06-1.58-3.93 0-1.87.99-2.79 1.34-3.17.35-.38.77-.47 1.03-.47h.74c.24.01.56-.09.87.65.32.76 1.09 2.63 1.18 2.82.1.19.16.41.03.66-.13.25-.19.41-.39.63-.19.22-.41.49-.58.66-.19.19-.39.4-.17.78.23.38 1.01 1.63 2.17 2.64 1.49 1.3 2.75 1.7 3.14 1.89.39.19.62.16.84-.09.23-.25.97-1.11 1.23-1.49.26-.38.52-.31.87-.19.35.13 2.24 1.03 2.62 1.22.39.19.65.28.74.44.1.16.1.91-.22 1.79Z"

        <!-- HAMBURGER -->

  <!-- =========================================
       NAV BAR - NAVY
       ========================================= -->

    <div class="site-header__container">

      <nav
        class="site-header__nav"
        aria-label="Navegación principal"
      >

        <a
          href="#"
          class="site-header__nav-link site-header__nav-link--active"
        >
          Inicio
        </a>

        <a href="#" class="site-header__nav-link">
          Servicios
        </a>

        <a href="#" class="site-header__nav-link">
          Nosotros
        </a>

        <a href="#" class="site-header__nav-link">
          Trabajos
        </a>

        <a href="#" class="site-header__nav-link">
          Contacto
        </a>

        <!-- MOBILE WHATSAPP CTA -->
        <a
          href="https://wa.me/573001234567"
          class="site-header__mobile-cta"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="site-header__mobile-cta-icon">
            <svg
              viewBox="0 0 32 32"
              width="21"
              height="21"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M16.04 3C8.84 3 3 8.7 3 15.74c0 2.25.61 4.45 1.76 6.37L3 29l7.07-1.82a13.32 13.32 0 0 0 5.96 1.43h.01C23.24 28.61 29 22.91 29 15.87 29 8.82 23.24 3 16.04 3Zm7.57 18.23c-.32.88-1.88 1.69-2.58 1.78-.66.09-1.5.13-2.42-.15-.56-.17-1.28-.41-2.21-.81-3.89-1.65-6.43-5.49-6.62-5.75-.19-.25-1.58-2.06-1.58-3.93 0-1.87.99-2.79 1.34-3.17.35-.38.77-.47 1.03-.47h.74c.24.01.56-.09.87.65.32.76 1.09 2.63 1.18 2.82.1.19.16.41.03.66-.13.25-.19.41-.39.63-.19.22-.41.49-.58.66-.19.19-.39.4-.17.78.23.38 1.01 1.63 2.17 2.64 1.49 1.3 2.75 1.7 3.14 1.89.39.19.62.16.84-.09.23-.25.97-1.11 1.23-1.49.26-.38.52-.31.87-.19.35.13 2.24 1.03 2.62 1.22.39.19.65.28.74.44.1.16.1.91-.22 1.79Z"

    </div>

  </div>


  <style>

    /* =========================================
       VARIABLES
       ========================================= */

    .site-header {
      --navy: #0b1425;
      --navy-light: #111d37;

      --gold: #c99a34;
      --gold-light: #e3bd63;

      --cream: #f3e3b7;
      --white: #f4f4f2;

      --whatsapp: #25d366;
      --whatsapp-dark: #128c7e;

      position: sticky;
      top: 0;

      z-index: 1000;

      width: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    .site-header__container {
      width: min(
        1180px,
        calc(100% - 48px)
      );

      margin: 0 auto;
    }


    /* =========================================
       TOP BAR
       ========================================= */

    .site-header__top {
      position: relative;

      background:
        linear-gradient(
          135deg,
          var(--gold-light) 0%,
          var(--gold) 100%
        );

      box-shadow:
        0 3px 12px
        rgba(0, 0, 0, 0.18);
    }


    .site-header__top-inner {
      min-height: 88px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 32px;
    }


    /* =========================================
       LOGO
       ========================================= */

    .site-header__logo {
      display: inline-flex;
      align-items: center;

      flex-shrink: 0;

      text-decoration: none;
    }


    .site-header__logo-image {
      display: block;

      width: auto;
      max-width: 220px;
      height: 58px;

      object-fit: contain;
    }


    /* =========================================
       WHATSAPP DESKTOP
       ========================================= */

    .site-header__whatsapp {
      display: inline-flex;
      align-items: center;

      gap: 13px;

      padding: 10px 18px 10px 11px;

      background:
        var(--navy);

      border:
        1px solid
        rgba(11, 20, 37, 0.8);

      border-radius: 5px;

      color: var(--white);

      text-decoration: none;

      box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.18);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    .site-header__whatsapp:hover {
      transform:
        translateY(-2px);

      background:
        var(--navy-light);

      box-shadow:
        0 7px 16px
        rgba(0, 0, 0, 0.25);
    }


    .site-header__whatsapp-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      background:
        var(--whatsapp);

      color: #fff;

      border-radius: 50%;

      box-shadow:
        0 0 0 4px
        rgba(37, 211, 102, 0.12);
    }


    .site-header__whatsapp-copy {
      display: flex;
      flex-direction: column;

      line-height: 1.15;
    }


    .site-header__whatsapp-label {
      margin-bottom: 4px;

      color:
        var(--gold-light);

      font-size: 12px;
      font-weight: 700;

      letter-spacing:
        0.08em;
    }


    .site-header__whatsapp-number {
      color: var(--white);

      font-size: 17px;
      font-weight: 700;
    }


    /* =========================================
       NAV BAR
       ========================================= */

    .site-header__nav-bar {
      background:
        var(--navy);

      border-top:
        1px solid
        rgba(255, 255, 255, 0.06);

      border-bottom:
        1px solid
        rgba(227, 189, 99, 0.25);

      box-shadow:
        0 6px 18px
        rgba(0, 0, 0, 0.24);
    }


    .site-header__nav {
      min-height: 58px;

      display: flex;
      align-items: stretch;

      gap: 34px;
    }


    .site-header__nav-link {
      position: relative;

      display: inline-flex;
      align-items: center;

      color: var(--cream);

      font-size: 15px;
      font-weight: 600;

      text-decoration: none;

      transition:
        color 0.2s ease;
    }


    /*
     * Underline animado
     */

    .site-header__nav-link::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 3px;

      background:
        var(--gold-light);

      transform: scaleX(0);

      transform-origin:
        center;

      transition:
        transform 0.22s ease;
    }


    .site-header__nav-link:hover {
      color:
        var(--gold-light);
    }


    .site-header__nav-link:hover::after {
      transform:
        scaleX(1);
    }


    /* ACTIVE */

    .site-header__nav-link--active {
      color:
        var(--gold-light);
    }


    .site-header__nav-link--active::after {
      transform:
        scaleX(1);
    }


    /* =========================================
       MOBILE CONTROLS
       ========================================= */

    .site-header__toggle {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;
    }


    .site-header__mobile-actions {
      display: none;

      align-items: center;

      gap: 10px;
    }


    .site-header__whatsapp-mobile {
      display: inline-flex;
      align-items: center;

      gap: 7px;

      min-height: 42px;

      padding:
        0 12px;

      background:
        var(--navy);

      color:
        var(--white);

      border-radius:
        4px;

      font-size:
        13px;

      font-weight:
        700;

      text-decoration:
        none;
    }


    .site-header__whatsapp-mobile svg {
      color:
        var(--whatsapp);
    }


    /* =========================================
       HAMBURGER
       ========================================= */

    .site-header__menu-button {
      width: 43px;
      height: 43px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 5px;

      background:
        var(--navy);

      border-radius:
        4px;

      cursor: pointer;
    }


    .site-header__menu-button span {
      display: block;

      width: 20px;
      height: 2px;

      background:
        var(--gold-light);

      border-radius:
        3px;

      transition:
        transform 0.25s ease,
        opacity 0.2s ease;
    }


    /* =========================================
       MOBILE CTA INSIDE MENU
       ========================================= */

    .site-header__mobile-cta {
      display: none;

      align-items: center;
      justify-content: center;

      gap: 10px;

      width: 100%;

      min-height: 48px;

      margin-top: 10px;

      padding:
        0 18px;

      background:
        var(--gold);

      color:
        var(--navy);

      border-radius:
        4px;

      font-size:
        14px;

      font-weight:
        800;

      text-decoration:
        none;

      box-sizing:
        border-box;
    }


    .site-header__mobile-cta-icon {
      display: flex;

      color:
        var(--whatsapp-dark);
    }


    /* =========================================
       TABLET / MOBILE
       ========================================= */

    @media
    (max-width: 800px) {

      .site-header__container {
        width:
          calc(100% - 28px);
      }


      /*
       * La barra superior pasa a ser
       * toda la navegación visible.
       */

      .site-header__top-inner {
        min-height:
          70px;

        gap:
          14px;
      }


      .site-header__logo-image {
        max-width:
          150px;

        height:
          46px;
      }


      /*
       * Ocultamos WhatsApp grande
       */

      .site-header__whatsapp--desktop {
        display:
          none;
      }


      /*
       * Mostramos WhatsApp compacto
       * + hamburger.
       */

      .site-header__mobile-actions {
        display:
          flex;
      }


      /*
       * El NAV se transforma en dropdown.
       */

      .site-header__nav-bar {
        max-height:
          0;

        overflow:
          hidden;

        border-bottom:
          0;

        opacity:
          0;

        transition:
          max-height 0.35s ease,
          opacity 0.25s ease;
      }


      .site-header__nav {
        min-height:
          0;

        flex-direction:
          column;

        align-items:
          stretch;

        gap:
          0;

        padding:
          8px 0 18px;
      }


      .site-header__nav-link {
        min-height:
          50px;

        padding:
          0 4px;

        border-bottom:
          1px solid
          rgba(
            255,
            255,
            255,
            0.06
          );

        font-size:
          15px;
      }


      /*
       * Línea vertical / lateral
       * en mobile en lugar de underline.
       */

      .site-header__nav-link::after {
        left:
          -14px;

        right:
          auto;

        top:
          50%;

        bottom:
          auto;

        width:
          3px;

        height:
          22px;

        transform:
          translateY(-50%)
          scaleY(0);
      }


      .site-header__nav-link:hover::after,
      .site-header__nav-link--active::after {
        transform:
          translateY(-50%)
          scaleY(1);
      }


      .site-header__mobile-cta {
        display:
          flex;
      }


      /*
       * ABRIR MENU
       */

      .site-header__toggle:checked
      ~ .site-header__nav-bar {
        max-height:
          500px;

        opacity:
          1;

        border-bottom:
          1px solid
          rgba(
            227,
            189,
            99,
            0.25
          );
      }


      /*
       * Hamburger -> X
       */

      .site-header__toggle:checked
      ~ .site-header__top
      .site-header__menu-button
      span:nth-child(1) {
        transform:
          translateY(7px)
          rotate(45deg);
      }


      .site-header__toggle:checked
      ~ .site-header__top
      .site-header__menu-button
      span:nth-child(2) {
        opacity:
          0;
      }


      .site-header__toggle:checked
      ~ .site-header__top
      .site-header__menu-button
      span:nth-child(3) {
        transform:
          translateY(-7px)
          rotate(-45deg);
      }

    }


    /* =========================================
       SMALL MOBILE
       ========================================= */

    @media
    (max-width: 440px) {

      .site-header__container {
        width:
          calc(100% - 20px);
      }


      .site-header__top-inner {
        min-height:
          64px;
      }


      .site-header__logo-image {
        max-width:
          125px;

        height:
          40px;
      }


      .site-header__whatsapp-mobile {
        min-height:
          40px;

        padding:
          0 10px;

        font-size:
          12px;
      }


      /*
       * En pantallas muy pequeñas
       * podemos ocultar el texto
       * y dejar solo el icono.
       */

      .site-header__whatsapp-mobile span {
        display:
          none;
      }


      .site-header__whatsapp-mobile {
        width:
          40px;

        padding:
          0;

        justify-content:
          center;
      }


      .site-header__menu-button {
        width:
          40px;

        height:
          40px;
      }

    }

  </style>

</header>
